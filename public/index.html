<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hub - Warcraft Style Home</title>
    <!-- Importing a fantasy-style Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #c79c2e;
            --dark-bg: #0b0b0e;
            --panel-bg: rgba(18, 18, 24, 0.9);
            --border-glow: #e6b839;
            --text-light: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-bg);
            /* Warcraft-inspired subtle dark stone/texture fallback */
            background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                              radial-gradient(circle, #2a251f 0%, #0d0c10 100%);
            color: var(--text-light);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 30px 15px 15px 15px;
            background: linear-gradient(to bottom, #15131b, transparent);
            border-bottom: 2px solid var(--primary-gold);
            box-shadow: 0 4px 20px rgba(199, 156, 46, 0.2);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px #000, 0 0 15px rgba(199, 156, 46, 0.5);
        }

        header p {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: #9c9382;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            width: 100%;
        }

        /* Warcraft styled container box for the video */
        .playlist-container {
            width: 100%;
            max-width: 700px;
            background: var(--panel-bg);
            border: 3px solid var(--primary-gold);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(199, 156, 46, 0.15);
            position: relative;
        }

        /* Decorative corner ornaments look */
        .playlist-container::before {
            content: "";
            position: absolute;
            top: -6px; left: -6px;
            width: 15px; height: 15px;
            border-top: 3px solid #fff;
            border-left: 3px solid #fff;
        }
        .playlist-container::after {
            content: "";
            position: absolute;
            bottom: -6px; right: -6px;
            width: 15px; height: 15px;
            border-bottom: 3px solid #fff;
            border-right: 3px solid #fff;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 4px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #08070a;
            border-top: 1px solid #2a251f;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            color: #8c8270;
            letter-spacing: 1px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
        }

        /* Android Mobile Optimization */
        @media screen and (max-width: 600px) {
            header h1 {
                font-size: 2.1rem;
                letter-spacing: 2px;
            }
            header p {
                font-size: 0.85rem;
            }
            .playlist-container {
                padding: 10px;
                border-width: 2px;
            }
            body {
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>The Hub</h1>
        <p>Welcome, Traveler</p>
    </header>

    <div class="main-content">
        <!-- Centered YouTube Playlist Embed -->
        <div class="playlist-container">
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/videoseries?list=PLZGxL0vUdp6s" 
                        title="The Hub YouTube Playlist" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Next Network Entertainment Inc. All Rights Reserved.
    </footer>

</body>
</html>
